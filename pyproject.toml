[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookflow"
version = "0.1.0"
description = "A local SQLite-backed CLI for small reading rooms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bookflow = "bookflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
